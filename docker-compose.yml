name: becas-php84
services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
  nginx:
    image: nginx:stable-alpine
    depends_on:
      - app
    ports:
      - "8084:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
