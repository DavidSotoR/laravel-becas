name: becas-php84-mysql
services:
  mysql_db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:33084:3306"
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_USER: becas
      MYSQL_PASSWORD: local-becas-only
      MYSQL_DATABASE: becas_php84
    volumes:
      - becas_php84_mysql:/var/lib/mysql
volumes:
  becas_php84_mysql:
